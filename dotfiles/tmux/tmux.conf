set -g status off          # no status bar
set -g mouse on            # mouse scrolling
set -s set-clipboard on    # forward OSC 52 copies from apps (nvim, pi) to the laptop clipboard
set -g default-terminal "xterm-256color"
set -g set-titles on       # propagate inner title to outer terminal
set -g set-titles-string '#T'
set -g window-size latest  # size to the latest client, not the smallest
set -g extended-keys on

# Make the focused pane obvious: dim the others, and label each pane with its
# running command (highlighted on the active pane).
set -g window-style        'fg=colour245,bg=colour235'
set -g window-active-style 'fg=terminal,bg=terminal'  # "default" would inherit window-style
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[reverse] #{pane_current_command} #[noreverse], #{pane_current_command} }'

# Drop default prefix bindings I don't use; prefix+x (kill pane) stays.
unbind s
unbind p
unbind a
unbind r

# Cmd+E (Ghostty sends C-b) then an arrow: move to the pane in that direction,
# or split one off on that side if there isn't one.
bind Left  if -F '#{pane_at_left}'   'split-window -hb -c "#{pane_current_path}"' 'select-pane -L'
bind Right if -F '#{pane_at_right}'  'split-window -h  -c "#{pane_current_path}"' 'select-pane -R'
bind Up    if -F '#{pane_at_top}'    'split-window -vb -c "#{pane_current_path}"' 'select-pane -U'
bind Down  if -F '#{pane_at_bottom}' 'split-window -v  -c "#{pane_current_path}"' 'select-pane -D'